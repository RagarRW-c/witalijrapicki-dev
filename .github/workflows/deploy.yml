name: Deploy to S3 & CloudFront

on:
  push:
    branches: [ feature ]  # Deploy na push do feature (zmień na 'main' po merge)

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Wymagane dla OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Twoja wersja Node z package.json

      - name: Install dependencies
        run: npm ci  # Szybsze niż npm install

      - name: Build Next.js
        run: npm run build

      - name: Export static files
        run: npm run export  # Generuje /out – dodaj do package.json jeśli brak: "export": "next export"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}  # ARN role z tf output
          aws-region: eu-central-1

      - name: Sync to S3
        run: aws s3 sync ./out s3://${{ vars.S3_BUCKET_NAME }} --delete  # Sync z delete starych plików

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_ID }} --paths "/*"  # Odświeża cache